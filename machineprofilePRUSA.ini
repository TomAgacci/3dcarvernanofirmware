# ============================================================
# CarvingCube120 — Clean-Room Machine Profile
# ============================================================

[printer]
name = CarvingCube120
bed_shape = 0x0,120x0,120x120,0x120
max_print_height = 120
extruders = 6
gcode_flavor = reprap

[extruder0]
extruder_colour = #FF0000

[extruder1]
extruder_colour = #00FF00

[extruder2]
extruder_colour = #0000FF

[extruder3]
extruder_colour = #FFFF00

[extruder4]
extruder_colour = #FF00FF

[extruder5]
extruder_colour = #00FFFF

# Start G-code
start_gcode = M700 ; clamp\nM701 ; calibrate\nG92 X0 Y0 Z0

# End G-code
end_gcode = G1 Z10 F600\nG1 X0 Y0 F3000\nM84
